{% extends "base.html" %}

{% block title %}Register - OurScheme{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        padding-top: 150px;
        padding-bottom: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .auth-card {
        width: 100%;
        max-width: 480px;
        padding: 30px;
        border: 2px solid #000;
        border-radius: 12px;
        background-color: #fff;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .auth-card h2 {
        text-align: center;
        margin-bottom: 20px;
        font-weight: 700;
    }
    .form-label {
        font-weight: 500;
        margin-bottom: 5px;
    }
    .form-control {
        border-radius: 6px;
        border: 1px solid #333;
        padding: 8px 12px;
    }
    .auth-btn {
        width: 100%;
        padding: 10px;
        border-radius: 20px;
        background-color: #000;
        color: #fff;
        font-weight: 600;
        border: none;
        margin-top: 15px;
        transition: 0.2s ease;
    }
    .auth-btn:hover {
        background-color: #333;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Create an Account</h2>
        <p class="text-center text-muted" style="font-size: 14px;">Join OurScheme to bookmark and track your eligible schemes</p>
        <hr>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required minlength="6">
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="6">
            </div>

            <button type="submit" class="auth-btn">Register</button>
        </form>

        <div class="text-center mt-3" style="font-size: 14px;">
            <span>Already have an account? </span>
            <a href="{{ url_for('login') }}" style="color: #0d6efd; text-decoration: none; font-weight: 600;">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
