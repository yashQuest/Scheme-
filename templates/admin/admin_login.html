<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - OurScheme</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Dedicated Admin CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin-body">

<div class="admin-login-wrapper">
    <div class="admin-login-card">
        <div class="admin-login-header">
            <h2>🏛️ OurScheme Admin</h2>
            <p>Enter your credentials to access the management panel</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category in ['error', 'danger'] else ('warning' if category == 'warning' else 'success') }} alert-dismissible fade show" role="alert" style="font-size: 0.9rem;">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="admin-form-group">
                <label for="username" class="admin-form-label">Username or Email</label>
                <input type="text" class="admin-form-control" id="username" name="username" placeholder="Enter admin username" required autofocus>
            </div>

            <div class="admin-form-group">
                <label for="password" class="admin-form-label">Password</label>
                <input type="password" class="admin-form-control" id="password" name="password" placeholder="Enter admin password" required>
            </div>

            <button type="submit" class="admin-login-btn">Secure Login →</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="{{ url_for('home') }}" style="color: #64748b; font-size: 0.85rem; text-decoration: none;">← Return to OurScheme Public Website</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
