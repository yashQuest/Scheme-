<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add contact</title>
    <link rel="stylesheet" href="modalpopup.css">
</head>

<body>
    <button id="openBtn">Add Contact</button>

    <div id="modal">
        <div id="box">
            <h2>Add Contact</h2>
            <hr>


            <div class="lab">
            <label for="name" id="namelab" class="lab text" required>Name:</label><br>
            <input type="text" id="name" class="lab1">

            </div>

            <div id="maillab" class="lab">
                <label for="mail" id="mlab" class="text" required>Email</label><br>
                <input type="email" id="mail" class="lab1">
            </div>

            <div id="phonelab" class="lab">
                <label for="phone" id="plab" class="text" required>PhoneNumber:</label><br>
                <input type="tel" id="phone" class="lab1">
            </div>

            <div class="lab">
                <label for="company" id="comlab" class="text">Company(Optional)</label>
                <input type="text" id="company" class="lab1">
            </div>

            <div id="But">
                <button id="log" class="button">Add</button>
                <button id="closeBtn" class="button">Cancel</button>
            </div>
        </div>
    </div>

    <h1 id="output"></h1>
</body>
<script src="modalpopup.js"></script>

</html>
